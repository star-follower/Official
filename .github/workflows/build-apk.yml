name: Build Star Follower APK

on:
  push:
    branches:
      - replit-agent
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Web Dir & Prepare Capacitor
        run: |
          mkdir -p www
          cp -r index.html style.css *.js assets www/ 2>/dev/null || true
          cp -r * www/ 2>/dev/null || true
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Star Follower" "com.starfollower.official" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Star-Follower-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
