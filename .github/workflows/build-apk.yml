name: Build Star Follower APK

on:
  push:
    branches:
      - replit-agent
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Latest pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Web Assets with PNPM & Vite
        run: |
          rm -rf dist android capacitor.config.json
          pnpm install --no-frozen-lockfile
          
          # Install In-App Browser Plugin so TimeWall opens inside App
          pnpm add -w @capacitor/core @capacitor/android @capacitor/browser
          pnpm add -w -D @capacitor/cli

          # Force relative paths in Vite build
          npx vite build --base=./ || true
          
          # Fallback: Agar dist nahi bana ya incomplete hai
          mkdir -p dist
          cp -r *.html *.js *.css assets public dist/ 2>/dev/null || true

          # Inject Base Tag & Auto In-App Tab Script inside index.html for Android Webview
          node -e '
            const fs = require("fs");
            if (fs.existsSync("dist/index.html")) {
              let html = fs.readFileSync("dist/index.html", "utf8");
              if (!html.includes("<base")) {
                html = html.replace("<head>", "<head><base href=\"./\">");
              }
              // Script to capture external clicks and open inside App
              const inAppScript = `
                <script>
                  document.addEventListener("click", function(e) {
                    const target = e.target.closest("a, button");
                    if (target) {
                      const href = target.getAttribute("href") || target.getAttribute("onclick");
                      if (href && (href.includes("timewall") || href.includes("http"))) {
                        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
                          e.preventDefault();
                          window.Capacitor.Plugins.Browser.open({ url: href });
                        }
                      }
                    }
                  }, true);
                </script>
              `;
              html = html.replace("</head>", inAppScript + "</head>");
              fs.writeFileSync("dist/index.html", html);
            }
          '

          # Capacitor initialization with cleartext/browser support
          npx cap init "Star Follower" "com.starfollower.official" --web-dir dist
          
          # Enable Cleartext Traffic and Allow external links inside Android Webview
          node -e '
            const fs = require("fs");
            if (fs.existsSync("capacitor.config.json")) {
              let config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              config.server = { "cleartext": true, "allowNavigation": ["*"] };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
            }
          '

          npx cap add android
          
          # Inject Allow UsesCleartextTraffic inside AndroidManifest.xml
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let manifest = fs.readFileSync(manifestPath, "utf8");
              if (!manifest.includes("android:usesCleartextTraffic")) {
                manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\" ");
                fs.writeFileSync(manifestPath, manifest);
              }
            }
          '

          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Star-Follower-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
