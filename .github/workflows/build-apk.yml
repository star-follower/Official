name: Build Star Follower APK

on:
  push:
    branches:
      - replit-agent
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Latest pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Web Assets with PNPM & Vite
        run: |
          rm -rf dist android capacitor.config.json
          pnpm install --no-frozen-lockfile
          node -e '
            const fs = require("fs");
            let config = fs.existsSync("vite.config.ts") ? fs.readFileSync("vite.config.ts", "utf8") : "";
            if (!config.includes("base:")) {
              config = config.replace("defineConfig({", "defineConfig({\n  base: \"./\",");
              fs.writeFileSync("vite.config.ts", config);
            }
          '
          npx vite build
          pnpm add -w -D @capacitor/cli
          pnpm add -w @capacitor/core @capacitor/android
          npx cap init "Star Follower" "com.starfollower.official" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Star-Follower-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
