name: Build Star Follower APK

on:
  push:
    branches:
      - replit-agent
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Latest pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Web Assets with PNPM & Vite
        run: |
          rm -rf dist android capacitor.config.json
          pnpm install --no-frozen-lockfile
          
          # Force relative paths in Vite build
          npx vite build --base=./ || true
          
          # Fallback: Agar dist nahi bana ya incomplete hai
          mkdir -p dist
          cp -r *.html *.js *.css assets public dist/ 2>/dev/null || true

          # Inject Base Tag inside index.html for Android Webview
          node -e '
            const fs = require("fs");
            if (fs.existsSync("dist/index.html")) {
              let html = fs.readFileSync("dist/index.html", "utf8");
              if (!html.includes("<base")) {
                html = html.replace("<head>", "<head><base href=\"./\">");
                fs.readFileSync("dist/index.html");
                fs.writeFileSync("dist/index.html", html);
              }
            }
          '

          # Capacitor initialization
          pnpm add -w -D @capacitor/cli
          pnpm add -w @capacitor/core @capacitor/android
          npx cap init "Star Follower" "com.starfollower.official" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Star-Follower-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
